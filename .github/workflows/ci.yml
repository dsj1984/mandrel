name: CI / CD

# Action pinning (Story #3399): third-party `uses:` refs are pinned to full
# 40-char commit SHAs with a `# vX.Y.Z` comment. First-party `actions/*`
# remain on major-version tags (`@v4`) — Dependabot's `github-actions`
# ecosystem updates those tags in-place and SHA-pinning would require a
# manual bump per release with no automated PR surface. Revisit when
# Dependabot action pinning is enabled repo-wide.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch: # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and Test
    # Single ubuntu-latest / node 22 leg. The matrix shape was retired in
    # PR #1348 once the only remaining axis was a degenerate one — Windows
    # was removed from this job earlier (#1270) because full Windows
    # coverage + baseline gates produced c8/timing flap with no source
    # defects. A lighter advisory Windows smoke leg lives in the
    # `windows-smoke` job below (Story #3389). See #1267 for the per-OS
    # baseline plan if matrix-shaped CI is ever reinstated.
    runs-on: ubuntu-latest
    # Story #4936: every job here used to inherit GitHub's 360-minute default,
    # so a deadlock cost six hours of runner time and — while the run stayed
    # `in_progress` — withheld the logs of the failing required check on the
    # same run. Sized from this job's observed 155s: 20 minutes is ~8x
    # headroom over the heaviest leg (audit + TruffleHog + node-pty source
    # build + the full coverage suite) while still catching a hang fast.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node & Install
        uses: ./.github/actions/setup

      - name: Dependency Vulnerability Audit (SCA)
        id: sca
        # Left as the bare invocation on purpose: dependency-audit-cron.yml
        # copies this exact command so the nightly sweep and this required
        # check can never disagree about what counts as red. Attribution is a
        # SEPARATE step below rather than a wrapper, so that stays true.
        run: npm audit --audit-level=high

      - name: Attribute the advisory failure
        # Runs only once the required step above has already failed, and only
        # for a pull request — a push build has no merge base to attribute
        # against and keeps the bare behaviour.
        #
        # This does NOT rescue the build. The job is already failing, and the
        # script exits 1 on both real verdicts: a pre-existing advisory is
        # still a real advisory, and letting it pass here would let advisories
        # accumulate on `main` unnoticed, which is what the nightly sweep
        # exists to prevent. What it buys is the sentence the log was missing
        # — whether this diff caused the failure — so an author who did not
        # cause it stops debugging a supply-chain advisory that is not theirs.
        if: |
          always() && steps.sca.outcome == 'failure' &&
          github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # `continue-on-error` keeps a degraded probe from masking or
        # compounding the SCA failure; the job's verdict is the audit's.
        continue-on-error: true
        run: node .agents/scripts/check-audit-attribution.js --base "$BASE_SHA"

      - name: Action Pinning Guard
        # Story #4079: fail the build if any third-party `uses:` ref drifts off
        # a full 40-char commit SHA onto a branch head (`@main`/`@master`) or a
        # floating tag (`@v5`). First-party `actions/*` refs may stay on
        # major-version tags (Dependabot bumps those in-place). This is the
        # real, automated gate the comments below reference — there is no
        # `npm run audit-security` script (that name is only the manual
        # `/audit-security` slash-command lens).
        run: node .agents/scripts/check-action-pinning.js

      - name: Secret Scanning (TruffleHog)
        # Pinned to a released tag rather than the moving `@main` head — a
        # third-party action's default branch is a supply-chain risk vector
        # (CWE-1357). Bump deliberately when a new TruffleHog release ships;
        # the `Action Pinning Guard` step above (check-action-pinning.js)
        # fails the build on any reversion to `@main` / `@master` / a
        # floating tag.
        uses: trufflesecurity/trufflehog@37b77001d0174ebec2fcca2bd83ff83a6d45a3ab # v3.95.3
        with:
          extra_args: --debug --only-verified

      - name: Lint and Format
        # Story #1829: `npm run lint` now invokes `biome ci .` (lint +
        # format check + import order) in parallel with `markdownlint-cli2`
        # via .agents/scripts/run-lint.js, so the prior separate
        # `npm run format:check` step is folded in and removed.
        run: npm run lint

      # Story #5004: the `Maintainability Check` step that used to sit here
      # ran `npm run maintainability:check` — `check-baselines.js --gate
      # maintainability`, a strict subset of the `Run check-baselines` step in
      # the required `baselines` job below, against the same default scope on
      # PR runs. It failed on nothing the required job did not already fail on,
      # so it bought a second baseline read and no protection.
      #
      # A later correction pass revisited the rest of what #5004 recorded here. That comment
      # claimed the step's push-to-main-only
      # `BASELINE_SCOPE: ${{ github.event_name == 'pull_request' && '' || 'full' }}`
      # leg was a full-scope SWEEP that re-scored untouched files, and that
      # deleting the step lost it. It was not, and it did not.
      # `check-baselines.js` is a reader: it loads the COMMITTED baseline
      # envelope and never invokes a scorer. On that path `full` means only
      # "skip the head-vs-base compare arm" — see `evaluateCompare` in
      # .agents/scripts/lib/orchestration/check-baselines/phases/compare.js,
      # which returns an empty result whenever `scope.mode !== 'diff'`.
      # Measured: the default scope compares 556 rows against the base
      # baseline; `BASELINE_SCOPE=full` compares 0 and reports
      # `baseRead: false`, in 0.18s (no escomplex pass happens at all). The
      # push leg was therefore floors-only — strictly WEAKER than the PR leg,
      # and a strict subset of the required `baselines` job on push runs too.
      # Nothing was lost with the step.
      #
      # Full-scope RE-SCORING lives on the write path (`*:update
      # -- --full-scope`) and in `check-baseline-drift.js`. Nothing in CI ran
      # the latter until this repository added
      # `.github/workflows/baseline-drift.yml` — a nightly job, deliberately
      # off the per-PR path so this duplication is not reintroduced.

      - name: Build node-pty for the PTY init guard
        # node-pty (1.x) ships no Linux prebuild and the shared setup installs
        # with `npm ci --ignore-scripts`, so its native addon is never compiled
        # and the interactive-init regression guard
        # (tests/e2e/init-interactive.integration.test.js) skips on this Linux
        # gate. `npm rebuild --build-from-source` no-ops here (the flag is not
        # propagated to node-pty's `node scripts/prebuild.js || node-gyp rebuild`
        # install), so build the addon directly with node-gyp (ubuntu-latest
        # ships python3 + make + g++) to produce build/Release/pty.node.
        # Best-effort + non-fatal: the test's own node-pty availability probe
        # still skips the guard gracefully if this build does not yield a
        # loadable binary, so the gate never reds on it.
        run: |
          ( cd node_modules/node-pty && npx --yes node-gyp rebuild ) || echo "::warning::node-pty source build failed; PTY init guard will skip on this run"

      - name: Snapshot temp/ stream hygiene (pre-test)
        # Story #4696: fingerprint the friction / lifecycle / trace NDJSON
        # streams under temp/ before the suite runs, so the post-test assert
        # can fail the build if any test appended fixture records to the real
        # telemetry tree (the writer-isolation regression this guards).
        # Story #4711: the baseline lives OUTSIDE the protected temp/ tree
        # (runner temp), so a test wiping temp/ cannot destroy the baseline
        # and fail the guard open.
        run: node .agents/scripts/check-test-temp-hygiene.js --snapshot --baseline "$RUNNER_TEMP/test-temp-hygiene-snapshot.json"

      - name: Run Tests with Coverage
        # Capture stderr too — Node's test runner and the coverage-threshold
        # gate both emit failures on stderr, and a stdout-only redirect
        # hides them in the uploaded artifact (see Epic #441 Story 4.1).
        #
        # Story #4922 made this step name `pretest:coverage` explicitly,
        # because `.npmrc`'s `ignore-scripts=true` (supply-chain defence,
        # CWE-1357, which stays) suppresses every `pre*` / `post*` lifecycle
        # hook for `npm run` as well as for installs. Story #4936 moved the
        # invocation into the runner itself
        # (`lib/test-runner-contract.js#runTierPreflight`), so the preflight
        # now fires for every tier and for every caller — including a bare
        # `node .agents/scripts/run-coverage.js` — instead of only where a
        # caller remembered to name it. There is deliberately no `pretest*`
        # script left to invoke here.
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee test-output.txt

      - name: Assert temp hygiene (post-test)
        # Story #4696: fail the build if the suite added or grew any stream
        # file under temp/ relative to the pre-test snapshot. A future writer
        # that bypasses the scratch seam reds here instead of silently
        # polluting friction / rollup / loop-health consumers. A missing
        # baseline is a hard failure (Story #4711) — never a re-baseline.
        # Story #4808: --lint-globs additionally fails the build when a test
        # file mints an OS temp dir outside makeTempDir(), which is what let
        # ~26k unreaped directories accumulate in the shared temp root. The
        # flag is passed here rather than defaulted on because this script
        # ships in the materialized .agents/ payload and the rule must not
        # fire on a consumer's own tests. The helper's spec is excluded: it
        # carries mkdtemp calls inside string fixtures.
        run: |
          node .agents/scripts/check-test-temp-hygiene.js --assert \
            --baseline "$RUNNER_TEMP/test-temp-hygiene-snapshot.json" \
            --lint-globs 'tests/**/*.js,.agents/**/__tests__/**/*.js,!tests/lib/test-temp.test.js'

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-output.txt

      # Story #1981 (Epic #1943): the per-kind coverage / CRAP /
      # maintainability / mutation gates have been folded into the
      # unified `check-baselines.js` runner — see the dedicated
      # `baselines` job below. The c8 coverage map is still uploaded
      # for downstream agent workflows that re-read per-method
      # coverage without re-running the suite.
      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-final
          path: coverage/coverage-final.json
          if-no-files-found: warn

  baselines:
    # Story #1912 / Task #1914 — surface the unified floor + tolerance +
    # schema gate as its own status check named `baselines`. As of
    # Epic #1943 (Story #1981) this is the *only* baseline gate: the
    # per-kind coverage / CRAP / maintainability / mutation gates have
    # been deleted and `branchProtection.requiredChecks` has been
    # collapsed to `["lint", "test", "baselines"]`.
    name: baselines
    runs-on: ubuntu-latest
    # Observed 19s of pure-Node ratchets. 10 minutes is the floor the
    # workflow-timeout gate enforces and still ~30x headroom here.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node & Install
        uses: ./.github/actions/setup

      - name: Run check-baselines
        run: node .agents/scripts/check-baselines.js --format text

      - name: Architecture Cycle Check
        # Story #4070: wire the import-cycle ratchet (check-arch-cycles.js,
        # allowlist baselines/arch-cycles.json) and the dead-export ratchet
        # (check-dead-exports.js, baseline baselines/dead-exports.json) into
        # the required `baselines` gate. Both are pure-Node, baseline-aware,
        # sub-second checks that were green-but-unenforced — running them here
        # converts documented-but-unenforced boundaries into build-failing
        # guardrails.
        #
        # Story #4438: the context-budget ratchet (check-context-budget.js,
        # budget baselines/context-budget.json) joins the same standalone-ratchet
        # slot — it measures the always-loaded doc closure + resolved
        # docsContextFiles byte totals and fails when a tier grows beyond the
        # committed tolerance, so doc-context growth becomes a conscious
        # baseline-refresh decision.
        #
        # Story #4575: the dead-export ratchet runs a second, production-mode
        # pass (baseline baselines/dead-exports-production.json). The default
        # pass treats tests/** as knip entry points, so an export whose last
        # importer is a test still reads as used — test usage keeps
        # production-dead code invisible. The production pass discounts test
        # importers and ratchets separately, because this repo sanctions
        # test-only exports (.agents/rules/test-seams.md) and its row set is
        # therefore large and largely intentional.
        #
        # The workflow-citation ratchet (check-workflow-citations.js, baseline
        # baselines/workflow-citations.json) joins the same slot: workflow
        # prose is resident context, so provenance asides are charged at the
        # instruction rate, and nothing but a ratchet stops them
        # re-accumulating one well-meaning citation at a time.
        #
        # Story #4923: the cyclomatic ratchet (check-cyclomatic.js, baseline
        # baselines/cyclomatic.json) joins the slot as the first consumer of
        # `codingGuardrails.cyclomaticMustFix`, which had been schema-validated,
        # bootstrap-defaulted and resolver-resolved while being read by nothing.
        # It records the existing over-ceiling functions per file and fails when
        # a change adds one or worsens a file's worst function.
        #
        # Story #4938: the orphan-schema gate (check-schema-references.js) joins
        # the slot. A schema under `.agents/schemas/` that no code path compiles
        # still reads as an enforced contract to every human and every audit
        # lens — one such file produced a High audit finding and a wrong
        # acceptance criterion before anyone read the validator. The gate has no
        # baseline: the answer is always zero, and a deliberate exception is
        # declared in the schema's own `x-mandrel-uncompiled` block.
        #
        # Story #5012: the baseline honesty surface. `check-baseline-scope.js`
        # asserts that each committed baseline's ROW SET still describes the
        # tree — an in-scope file with no row, a row whose file is gone or has
        # left the gate's scope — because every gate above can be green while
        # measuring almost nothing, and nothing checked that. It is
        # measurement-free — no scorer, no coverage artifact — so it costs
        # milliseconds and needs no test run to have happened.
        #
        # `prune-baseline-orphans.js --check` deliberately does NOT run here.
        # It reports the same `extra` direction (absent / out-of-scope rows)
        # that `check-baseline-scope.js` covers, but with no merge-base
        # attribution: it exits 1 on any stale row whatever landed it. That is
        # exactly the whole-tree equality the scope gate refuses, and pairing
        # them made the attribution unreachable — one PR deleting a file while
        # another re-adds its row via a baseline refresh leaves `main` carrying
        # a stale row, and every open PR then reds on divergence its author did
        # not create and cannot fix from their branch. The scope gate already
        # surfaces that row as an inherited warning; the pruner stays the
        # operator's remedy for clearing it.
        #
        # `check-knip-entries.js` runs ahead of the dead-exports pair it exists
        # to protect. #5001 made knip's entry list explicit (so an uninvoked CLI
        # surfaces as dead) and its `files` rule fatal (so whole-file death
        # produces rows) — but left the list hand-maintained. A CLI added after
        # #5001 is therefore unreachable to knip by default and emits a false
        # whole-file row, dragging its private lib modules along; #5012 produced
        # 5 such rows and was one accepted ratchet diff away from recording live
        # operator CLIs as expected-dead. This gate derives the invoked set from
        # the executable surfaces #5001's own AC-2 named and asserts it matches
        # the list, so the failure names its cause instead of arriving disguised
        # as debt.
        run: |
          node .agents/scripts/check-arch-cycles.js --format text
          node .agents/scripts/check-knip-entries.js
          node .agents/scripts/check-dead-exports.js
          node .agents/scripts/check-dead-exports.js --production
          node .agents/scripts/check-context-budget.js
          node .agents/scripts/check-workflow-citations.js
          node .agents/scripts/check-cyclomatic.js
          node .agents/scripts/check-schema-references.js
          node .agents/scripts/check-baseline-scope.js

  e2e:
    # Story #5111 — the real-binary tier, as its own job.
    #
    # `tests/e2e/**` packs this repository, installs it into a temp consumer
    # and drives the shipped `mandrel` binary end to end. Measured on the
    # authoring machine, `update-chain.integration.test.js` alone cost ~7 s of
    # system time and ~17 s of summed `npm install` wall clock — and every
    # second of it was charged to `npm test`, so every pre-push hook and every
    # local iteration paid for a signal that only moves when the release-shaped
    # install path moves. The tier now leaves `npm test`; this job is what
    # keeps the per-PR signal.
    #
    # Advisory, not required: `branchProtection.requiredChecks` in
    # `.agentrc.json` stays `lint` / `test` / `baselines`. Two of these three
    # suites degrade to a documented skip on a fresh runner by design — the
    # update chain probes for a warm npm cache (ENOTCACHED) and the
    # interactive-init guard probes for a loadable node-pty addon — so a
    # required check here would gate merges on cache warmth. The required
    # coverage job still *executes* these files (`FULL_TIER_GLOBS` in
    # lib/test-tiers.js is deliberately a superset of the `full` runner tier),
    # so nothing about the measured surface depends on this job's verdict.
    name: e2e
    runs-on: ubuntu-latest
    # Observed ~2.5 min locally for the whole tier including a real npm pack
    # and install. 20 minutes is ample headroom and still bounds a wedged
    # child that outlives the suite's own 180 s per-run timeout.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node & Install
        uses: ./.github/actions/setup

      - name: Build node-pty for the PTY init guard
        # Same rationale as the `validate` job: node-pty ships no Linux
        # prebuild and the shared setup installs with `--ignore-scripts`, so
        # without an explicit source build
        # tests/e2e/init-interactive.integration.test.js skips its guard.
        # Best-effort + non-fatal — the test's own availability probe still
        # skips gracefully if this does not yield a loadable binary.
        run: |
          ( cd node_modules/node-pty && npx --yes node-gyp rebuild ) || echo "::warning::node-pty source build failed; PTY init guard will skip on this run"

      - name: Run the e2e tier
        run: npm run test:e2e

  windows-smoke:
    # Story #3389 — advisory Windows leg. Exercises bootstrap, command sync,
    # config resolution, and the quick test tier without joining the
    # branch-protection required-check set (Validate and Test / baselines
    # names stay unchanged). Catches Windows-only regressions in worktree
    # path handling, PowerShell/npm wiring, and platform-conditional code
    # without reintroducing the c8/timing baseline flap that retired the
    # full Windows matrix leg (#1270).
    name: Windows Smoke
    runs-on: windows-latest
    # This is the job that deadlocked and burned 44 minutes. Observed 141s on
    # a healthy run; 15 minutes leaves ~6x headroom for a slow Windows runner
    # boot plus `npm ci`, and bounds the next deadlock to a quarter hour.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node & Install
        uses: ./.github/actions/setup

      - name: Bootstrap (dry-run)
        run: node .agents/scripts/bootstrap.js --dry-run --assume-yes --skip-github

      - name: Command Sync
        run: npm run sync:commands

      - name: Config Resolution
        run: >-
          node --experimental-test-module-mocks --test
          tests/shipped-configs-validate.test.js
          tests/lib/config-resolver.test.js

      - name: Fast Test Slice
        run: npm run test:quick

      - name: Worktree Manager Real-Git Contract
        # Story #4922: this suite is integration-tier, so `test:quick` above
        # excludes it — and the ubuntu leg is the only job that ran it. Its
        # drive-letter-case regression guard (v5.11.5) is gated on
        # `process.platform === 'win32'`, so the one assertion that exists
        # solely to catch a Windows defect executed in no CI job at all: on
        # Linux it skipped, on Windows it never ran. Running the file here is
        # what makes that guard real.
        run: >-
          node --experimental-test-module-mocks --test
          tests/lib/worktree-manager.integration.test.js

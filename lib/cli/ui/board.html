<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mandrel-token" content="__MANDREL_TOKEN__">
<title>Mandrel board</title>
<link rel="stylesheet" href="/board.css">
<script type="module" src="/board.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="product">Mandrel</span>
    <span class="repo mono" id="repository"></span>
  </div>
  <div class="actions">
    <details class="board-filter" id="status-filter" data-testid="status-filter">
      <summary title="Show Stories whose Project Status is"><span class="filter-label">Status:</span> <span id="status-filter-summary" data-testid="status-filter-summary">Any status</span></summary>
      <div class="filter-menu" id="status-filter-menu" data-testid="status-filter-menu"></div>
    </details>
    <details class="board-filter" id="assignee-filter" data-testid="assignee-filter">
      <summary title="Show Stories assigned to"><span class="filter-label">People:</span> <span id="assignee-filter-summary" data-testid="assignee-filter-summary">Everyone</span></summary>
      <div class="filter-menu" id="assignee-filter-menu" data-testid="assignee-filter-menu"></div>
    </details>
    <button type="button" class="icon-button" id="panel-environments-button" data-testid="panel-environments-button" aria-label="Environments" title="Environments" aria-controls="side-panel" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>
      <span class="badge" id="panel-environments-offline-count" data-testid="panel-environments-offline-count" hidden></span>
    </button>
    <button type="button" class="icon-button" id="panel-connections-button" data-testid="panel-connections-button" aria-label="Connections" title="Connections: checking" aria-controls="side-panel" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 2v5M15 2v5M6 7h12v4a6 6 0 0 1-12 0zM12 17v5"/></svg>
    </button>
    <button type="button" class="icon-button" id="panel-settings-button" data-testid="panel-settings-button" aria-label="Settings" title="Settings" aria-controls="side-panel" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</header>

<p class="zone-verdict" id="zone-verdict" data-testid="zone-verdict" role="status" aria-live="polite"></p>

<main>
  <div class="board" id="board" data-testid="board">
    <section class="column" data-testid="column-backlog" data-zone="backlog" aria-label="Backlog">
      <h2>Backlog <span class="zone-hint"></span></h2>
      <div class="cards"></div>
    </section>
    <section class="column" data-testid="column-planning" data-zone="planning" aria-label="Planning">
      <h2>Planning <span class="zone-hint"></span></h2>
      <div class="cards"></div>
    </section>
    <section class="column" data-testid="column-ready" data-zone="ready" aria-label="Ready">
      <h2>Ready <span class="zone-hint"></span></h2>
      <div class="cards"></div>
    </section>
    <section class="column delivering" data-testid="column-delivering" data-zone="delivering" aria-label="Delivering">
      <h2>Delivering <span class="zone-hint"></span></h2>
      <div class="lanes"></div>
    </section>
    <section class="column" data-testid="column-blocked" data-zone="blocked" aria-label="Blocked">
      <h2>Blocked <span class="zone-hint"></span></h2>
      <div class="cards"></div>
    </section>
    <section class="column" data-testid="column-done" data-zone="done" aria-label="Done">
      <h2><span id="done-count" data-testid="done-count">Done</span> <span class="zone-hint"></span></h2>
      <div class="cards"></div>
    </section>
  </div>
</main>

<aside class="side-panel" id="side-panel" data-testid="side-panel" aria-label="Details" hidden>
  <div class="side-panel-bar">
    <button type="button" id="side-panel-close" data-testid="side-panel-close" aria-label="Close panel">×</button>
  </div>
  <div class="side-panel-view" id="side-panel-view"></div>
</aside>

<dialog class="panel" id="confirm-stop" data-testid="confirm-stop" aria-labelledby="confirm-title">
  <h2 id="confirm-title">Stop delivery?</h2>
  <p id="confirm-text"></p>
  <div class="dialog-actions">
    <button type="button" id="confirm-cancel">Cancel</button>
    <button type="button" class="danger" id="confirm-ok">Stop</button>
  </div>
</dialog>

<dialog class="panel" id="launch-options-dialog" data-testid="launch-options-dialog" aria-labelledby="launch-options-title">
  <h2 id="launch-options-title">Launch options</h2>
  <div class="setting">
    <label for="launch-options-model">Model</label>
    <select id="launch-options-model" data-testid="launch-options-model"></select>
  </div>
  <div class="setting">
    <label for="launch-options-effort">Effort</label>
    <select id="launch-options-effort" data-testid="launch-options-effort"></select>
  </div>
  <div class="effective" id="launch-options-effective" data-testid="launch-options-effective" aria-live="polite"></div>
  <div class="dialog-actions">
    <button type="button" id="launch-options-cancel">Cancel</button>
    <button type="button" id="launch-options-save" data-testid="launch-options-save">Save</button>
  </div>
</dialog>

<div class="toast" id="toast" data-testid="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
